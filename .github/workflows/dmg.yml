# A macOS .dmg on its own, without a release: run it by hand (Actions → macOS DMG → Run workflow) or
# push a tag starting with dmg- from any branch. One universal app (Intel and Apple Silicon), ad-hoc
# signed unless the Apple secrets are set (macOS then asks the user to allow it under Privacy &
# Security). The .dmg is attached to the run as an artifact.
name: macOS DMG

on:
  workflow_dispatch:
  push:
    tags: ['dmg-*']

permissions:
  contents: read

jobs:
  dmg:
    # Intel: GitHub has queued macOS arm64 jobs for 15+ minutes and dropped them (capacity). The
    # universal build cross-compiles the arm64 half, so an Intel runner makes the same .dmg.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Apple Translation's helper needs the macOS 26 SDK (TranslationSession outside SwiftUI).
      - name: Newest Xcode on the runner
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | python3 -c 'import re,sys; print(max(sys.stdin.read().split(), key=lambda p: [int(n) for n in re.findall(r"\d+", p)]))')
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Third-party licences
        run: node scripts/third-party-licenses.mjs aarch64-apple-darwin
      # Only secrets that exist are passed on: Tauri treats a variable that is set but empty as a certificate.
      - name: macOS signing and notarization secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<VAL_EOF"; echo "${!v}"; echo "VAL_EOF"; } >> "$GITHUB_ENV"
              echo "$v: set"
            else
              echo "$v: not set"
            fi
          done
      - run: npm run tauri build -- --target universal-apple-darwin --bundles dmg --config src-tauri/tauri.release.conf.json
      - name: The dmg was built, with the Apple Translation helper for both architectures
        # Tauri removes the intermediate .app after making the dmg: look inside the dmg itself.
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          ls -la "$dmg"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/ownvoice-dmg "$dmg"
          helper="/tmp/ownvoice-dmg/OwnVoice Meet.app/Contents/MacOS/ownvoice-apple-translate"
          ls -la "/tmp/ownvoice-dmg/OwnVoice Meet.app/Contents/MacOS"
          lipo -archs "$helper"
          "$helper" --self-check | tee /dev/stderr | grep -q '"sdk26":true' || { echo "::error::the helper was built without the macOS 26 SDK"; exit 1; }
          hdiutil detach /tmp/ownvoice-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OwnVoice-Meet-macOS-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
